<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../common/config.js?v=202607160712"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n1 / 記録一覧</title>
<link rel="stylesheet" href="../common/base.css?v=202607141905">
<style>
  /* ba-8(2026-07-20): このページ固有の色をローカル変数化(共有色はbase.cssのvar()を参照) */
  :root {
    --row-text: #dddddd;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --row-text: #2d3122;
    }
  }
  .day-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .day-date { font-weight: bold; }
  .row { font-size: 0.9rem; margin: 4px 0; color: var(--row-text); }
  .empty { color: var(--ink-soft); text-align: center; padding: 30px 0; }
  .score-display { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .score-num { font-size: 2.2rem; font-weight: 800; min-width: 50px; text-align: center; }
  #slider { flex: 1; }
  .note-input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; background: var(--input-bg); color: var(--ink); }
  .btn-save-score { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.95rem; }
  .score-saved { font-size: 0.78rem; color: var(--ink-soft); margin-top: 6px; text-align: center; min-height: 1.2em; }

  /* be(スコア推移グラフ)統合分。summary-bar/statはsrc/common/ledger.cssから移植、
     --paper-bandはbase.cssに無いためn1既存の--input-bgで代用する。 */
  .chart-wrap { margin: 20px 0 4px; }
  #scoreSvg { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .baseline { stroke: var(--ink-soft); stroke-width: 1; }
  .axis-label { fill: var(--ink-soft); font-size: 11px; }
  .score-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .score-area { fill: var(--accent); opacity: 0.12; }
  .score-dot { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
  .crosshair { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .hit-area { fill: transparent; }
  .summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; margin: 0 0 20px;
  }
  .stat { background: var(--input-bg); padding: 10px 12px; text-align: center; }
  .stat-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 1.2rem; font-weight: 700; }
  .stat-label { font-size: 0.62rem; color: var(--ink-soft); margin-top: 2px; }
  .score-tooltip {
    position: absolute; pointer-events: none; background: var(--input-bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-size: 0.78rem; color: var(--ink); opacity: 0; transition: opacity 0.08s ease;
    white-space: nowrap;
  }
  .score-tooltip .t-date { color: var(--ink-soft); font-size: 0.68rem; margin-bottom: 2px; }
  .score-tooltip .t-score { font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>路歴（n1） / 記録一覧</h1>
  <p id="lastUpdated" style="font-size:0.8rem;color:var(--ink-soft);">最終更新: 2026-07-16 07:48 JST</p>

<!-- LOGIN_GATE:START -->
  <div id="login-gate">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>
    <script>document.getElementById('g_id_onload').setAttribute('data-client_id', window.AA_GOOGLE_CLIENT_ID);</script>
    <div class="g_id_signin"></div>
    <p id="status">未ログイン(ログインすると記録一覧が表示されます)</p>
  </div>
<!-- LOGIN_GATE:END -->

  <div id="content" style="display:none;">
    <div class="section">
      <div class="section-title">スコア入力(<span id="scoreDate"></span>)</div>
      <div class="score-display">
        <div class="score-num" id="scoreNum">—</div>
        <input type="range" id="slider" min="0" max="100" value="80">
      </div>
      <input class="note-input" id="noteInput" type="text" placeholder="一言メモ(任意)">
      <button class="btn-save-score" id="btnSaveScore">保存</button>
      <div class="score-saved" id="scoreSaved"></div>
    </div>

    <div class="section">
      <div class="section-title">加点イベントを記録(ba-165)</div>
      <input class="note-input" id="pointAxis" type="text" placeholder="軸(例: 部屋片付け, 運動streak, 新規市)">
      <input class="note-input" id="pointValue" type="number" placeholder="点数(整数)">
      <input class="note-input" id="pointNote" type="text" placeholder="一言メモ(任意)">
      <button class="btn-save-score" id="btnSavePoint">記録</button>
      <div class="score-saved" id="pointSaved"></div>
    </div>

    <div class="section">
      <div class="section-title">クローズ配点ルールを変更(ba-159, 頻度低め)</div>
      <input class="note-input" id="rulePointsLow" type="number" placeholder="low(現在の既定=2)">
      <input class="note-input" id="rulePointsNormal" type="number" placeholder="normal(現在の既定=5)">
      <input class="note-input" id="rulePointsHigh" type="number" placeholder="high(現在の既定=10)">
      <input class="note-input" id="ruleEffectiveFrom" type="date" placeholder="発効日(未入力なら今日)">
      <input class="note-input" id="ruleNote" type="text" placeholder="変更理由(任意)">
      <button class="btn-save-score" id="btnSaveRule">新しいルールを追加</button>
      <div class="score-saved" id="ruleSaved"></div>
    </div>

    <div id="scoreChartSection" style="display:none;">
      <div class="chart-wrap">
        <svg id="scoreSvg" viewBox="0 0 680 300"></svg>
      </div>
      <div class="summary-bar">
        <div class="stat"><div class="stat-num" id="statLatest">—</div><div class="stat-label">最新</div></div>
        <div class="stat"><div class="stat-num" id="statAvg">—</div><div class="stat-label">平均</div></div>
        <div class="stat"><div class="stat-num" id="statMax">—</div><div class="stat-label">最高</div></div>
        <div class="stat"><div class="stat-num" id="statMin">—</div><div class="stat-label">最低</div></div>
      </div>
    </div>

    <p id="loadStatus">読み込み中...</p>
    <div id="list"></div>
    <p class="empty" id="emptyMsg" style="display:none;">記録はまだありません</p>
  </div>
  <div class="score-tooltip" id="scoreTooltip"></div>

  <script>window.AA_AUTH_EVENT = "n1-login-success"; window.AA_PUBLIC_VIEW = true;</script>
  <script src="../common/auth.js?v=202607201000"></script>
  <script type="module" src="app.js?v=202607261305"></script>
  <script type="module">
    import { applyLastUpdated } from "../common/last-updated.js";
    applyLastUpdated("src/n1", "lastUpdated", "最終更新");
  </script>
</body>
</html>
