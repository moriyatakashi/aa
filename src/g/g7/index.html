<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette - g7</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #ffffff;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    body.dark-mode header {
      border-bottom-color: #333;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .dark-mode-toggle {
      background: none;
      border: 1px solid #ccc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    body.dark-mode .dark-mode-toggle {
      border-color: #555;
    }

    .dark-mode-toggle:hover {
      background: #f0f0f0;
    }

    body.dark-mode .dark-mode-toggle:hover {
      background: #333;
    }

    .input-section {
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #666;
    }

    body.dark-mode label {
      color: #aaa;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      background: #fafafa;
      color: #1a1a1a;
    }

    body.dark-mode textarea {
      background: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    textarea::placeholder {
      color: #999;
    }

    body.dark-mode textarea::placeholder {
      color: #666;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    body.dark-mode .hint {
      color: #666;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-spin {
      background: #4a90e2;
      color: white;
    }

    .btn-spin:hover:not(:disabled) {
      background: #357abd;
      transform: scale(1.02);
    }

    .btn-clear {
      background: #e8e8e8;
      color: #333;
    }

    body.dark-mode .btn-clear {
      background: #333;
      color: #fff;
    }

    .btn-clear:hover:not(:disabled) {
      background: #d0d0d0;
    }

    body.dark-mode .btn-clear:hover:not(:disabled) {
      background: #444;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .roulette-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .wheel-container {
      position: relative;
      width: 240px;
      margin: 20px auto;
    }

    .wheel-pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      line-height: 1;
      z-index: 2;
      color: #e74c3c;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
    }

    .wheel-svg {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px #4a90e2;
      transform: rotate(0deg);
    }

    .wheel-svg.spinning {
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .wheel-svg .wedge-label {
      font-size: 11px;
      fill: white;
      font-weight: 500;
    }

    .wheel-svg .wedge.winner {
      stroke: #fff;
      stroke-width: 3;
    }

    .wheel-empty {
      width: 240px;
      height: 240px;
      margin: 0 auto;
      border-radius: 50%;
      border: 6px solid #4a90e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: #4a90e2;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f7ff;
      border-radius: 6px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.dark-mode .result {
      background: #1a3a52;
    }

    .result-text {
      font-size: 16px;
      font-weight: 500;
    }

    .item-list {
      background: #fafafa;
      border-radius: 6px;
      padding: 15px;
    }

    body.dark-mode .item-list {
      background: #2a2a2a;
    }

    .item-list-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    body.dark-mode .item-list-title {
      color: #aaa;
    }

    .items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .item-tag {
      background: white;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.dark-mode .item-tag {
      background: #333;
      border-color: #444;
    }

    .item-tag button {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 1;
    }

    body.dark-mode .item-tag button {
      color: #666;
    }

    .item-tag button:hover {
      color: #e74c3c;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 20px 0;
      font-size: 13px;
    }

    body.dark-mode .empty-state {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎡 Roulette</h1>
      <button class="dark-mode-toggle" onclick="toggleDarkMode()">Dark</button>
    </header>

    <div class="input-section">
      <label for="itemInput">項目を入力（1行1項目）</label>
      <textarea 
        id="itemInput" 
        placeholder="項目1&#10;項目2&#10;項目3&#10;..."></textarea>
      <div class="hint">入力後、「回転」ボタンでランダムに選択します</div>
    </div>

    <div class="roulette-section">
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <svg id="wheelSvg" class="wheel-svg" viewBox="0 0 240 240" style="display:none;">
          <g id="wheelGroup"></g>
        </svg>
        <div class="wheel-empty" id="wheelEmpty">🎡</div>
      </div>
      <div class="result">
        <div class="result-text" id="resultText">入力して回転を押してください</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-spin" onclick="spinRoulette()">回転</button>
      <button class="btn-clear" onclick="clearItems()">クリア</button>
    </div>

    <div class="item-list">
      <div class="item-list-title">登録済み項目</div>
      <div class="items" id="itemsList">
        <div class="empty-state">項目を入力してください</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'roulette_items';
    // 扇形1つあたりの色。項目数がこれより多い場合は先頭から繰り返す。
    const WEDGE_COLORS = ['#4a90e2', '#e67e22', '#2ecc71', '#e74c3c', '#9b59b6', '#1abc9c', '#f1c40f', '#34495e'];
    const WHEEL_CX = 120, WHEEL_CY = 120, WHEEL_R = 118;
    const SPIN_DURATION_MS = 3000;

    let items = [];
    let isSpinning = false;
    let currentRotation = 0; // 累積回転角(度)。次の回転は必ずこれより先に進める(逆回転しない)。

    function loadItems() {
      const saved = localStorage.getItem(STORAGE_KEY);
      items = saved ? JSON.parse(saved) : [];
      updateDisplay();
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // 円周上の角度(0度=真上、時計回り)から、SVG座標系の点を返す。
    function pointOnCircle(angleDeg, r) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return { x: WHEEL_CX + r * Math.cos(rad), y: WHEEL_CY + r * Math.sin(rad) };
    }

    function wedgePath(startAngle, endAngle) {
      const start = pointOnCircle(startAngle, WHEEL_R);
      const end = pointOnCircle(endAngle, WHEEL_R);
      const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
      return `M ${WHEEL_CX} ${WHEEL_CY} L ${start.x} ${start.y} A ${WHEEL_R} ${WHEEL_R} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
    }

    // 項目数ぶんの扇形(wedge)+ラベルをSVGへ描画する。バグ①②(3つ入れても扇形が3つに
    // ならず、回転はするが見た目がルーレットにならない)の対応: 以前は単一の円div+
    // 一律360度の見た目だけの回転で、項目数に応じた扇形を一切描いていなかった。
    function renderWheel() {
      const svg = document.getElementById('wheelSvg');
      const empty = document.getElementById('wheelEmpty');
      const group = document.getElementById('wheelGroup');
      group.innerHTML = '';

      if (items.length === 0) {
        svg.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }
      svg.style.display = '';
      empty.style.display = 'none';

      const segmentAngle = 360 / items.length;
      items.forEach((item, idx) => {
        const startAngle = idx * segmentAngle;
        const endAngle = startAngle + segmentAngle;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', wedgePath(startAngle, endAngle));
        path.setAttribute('fill', WEDGE_COLORS[idx % WEDGE_COLORS.length]);
        path.setAttribute('stroke', 'rgba(255,255,255,0.5)');
        path.setAttribute('stroke-width', '1');
        path.dataset.idx = idx;
        path.classList.add('wedge');
        group.appendChild(path);

        // ラベルは扇形の中心角・8割の半径あたりに、外向きに回転させて置く。
        const labelAngle = startAngle + segmentAngle / 2;
        const labelPos = pointOnCircle(labelAngle, WHEEL_R * 0.62);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', labelPos.x);
        text.setAttribute('y', labelPos.y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('transform', `rotate(${labelAngle}, ${labelPos.x}, ${labelPos.y})`);
        text.classList.add('wedge-label');
        text.textContent = item.length > 8 ? item.slice(0, 7) + '…' : item;
        group.appendChild(text);
      });
    }

    function updateDisplay() {
      const textarea = document.getElementById('itemInput');
      textarea.value = items.join('\n');

      const itemsList = document.getElementById('itemsList');
      if (items.length === 0) {
        itemsList.innerHTML = '<div class="empty-state">項目を入力してください</div>';
      } else {
        itemsList.innerHTML = items.map((item, idx) => `
          <div class="item-tag">
            <span>${escapeHtml(item)}</span>
            <button onclick="removeItem(${idx})">×</button>
          </div>
        `).join('');
      }
      renderWheel();
    }

    function updateItemsFromTextarea() {
      const textarea = document.getElementById('itemInput');
      items = textarea.value
        .split('\n')
        .map(item => item.trim())
        .filter(item => item.length > 0);
      saveItems();
      updateDisplay();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      saveItems();
      updateDisplay();
    }

    function spinRoulette() {
      updateItemsFromTextarea();

      if (items.length === 0) {
        alert('項目を入力してください');
        return;
      }

      if (isSpinning) return;
      isSpinning = true;

      const svg = document.getElementById('wheelSvg');
      const resultText = document.getElementById('resultText');
      const selectedIdx = Math.floor(Math.random() * items.length);

      // ポインタ(真上・0度)に選ばれた扇形の中心が来るよう、回転角を厳密に計算する。
      // 見た目の派手さのため5周分を上乗せしつつ、常に「今より先」へ回す(巻き戻さない)。
      const segmentAngle = 360 / items.length;
      const targetCenter = (selectedIdx + 0.5) * segmentAngle;
      const desiredMod360 = (360 - targetCenter) % 360;
      const extraSpins = 5;
      const delta = ((desiredMod360 - currentRotation) % 360 + 360) % 360;
      currentRotation = currentRotation + extraSpins * 360 + delta;

      svg.classList.add('spinning');
      svg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        svg.classList.remove('spinning');
        document.querySelectorAll('.wedge').forEach(w => w.classList.remove('winner'));
        const winnerWedge = svg.querySelector(`.wedge[data-idx="${selectedIdx}"]`);
        if (winnerWedge) winnerWedge.classList.add('winner');
        resultText.textContent = `🎉 ${items[selectedIdx]}`;
        isSpinning = false;
      }, SPIN_DURATION_MS);
    }

    function clearItems() {
      if (confirm('すべての項目を削除しますか？')) {
        items = [];
        currentRotation = 0;
        saveItems();
        updateDisplay();
        document.getElementById('resultText').textContent = '入力して回転を押してください';
        const svg = document.getElementById('wheelSvg');
        svg.classList.remove('spinning');
        svg.style.transform = 'rotate(0deg)';
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('roulette_dark_mode', document.body.classList.contains('dark-mode'));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 初期化
    loadItems();
    if (localStorage.getItem('roulette_dark_mode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    // テキスト変更を監視
    document.getElementById('itemInput').addEventListener('change', () => {
      updateItemsFromTextarea();
    });
    document.getElementById('itemInput').addEventListener('blur', () => {
      updateItemsFromTextarea();
    });
  </script>
</body>
</html>
