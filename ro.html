<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette - ro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      background: #1a1a1a;
      color: #ffffff;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    body.dark-mode header {
      border-bottom-color: #333;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .dark-mode-toggle {
      background: none;
      border: 1px solid #ccc;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    body.dark-mode .dark-mode-toggle {
      border-color: #555;
    }

    .dark-mode-toggle:hover {
      background: #f0f0f0;
    }

    body.dark-mode .dark-mode-toggle:hover {
      background: #333;
    }

    .input-section {
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #666;
    }

    body.dark-mode label {
      color: #aaa;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      background: #fafafa;
      color: #1a1a1a;
    }

    body.dark-mode textarea {
      background: #2a2a2a;
      border-color: #444;
      color: #fff;
    }

    textarea::placeholder {
      color: #999;
    }

    body.dark-mode textarea::placeholder {
      color: #666;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    body.dark-mode .hint {
      color: #666;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-spin {
      background: #4a90e2;
      color: white;
    }

    .btn-spin:hover:not(:disabled) {
      background: #357abd;
      transform: scale(1.02);
    }

    .btn-clear {
      background: #e8e8e8;
      color: #333;
    }

    body.dark-mode .btn-clear {
      background: #333;
      color: #fff;
    }

    .btn-clear:hover:not(:disabled) {
      background: #d0d0d0;
    }

    body.dark-mode .btn-clear:hover:not(:disabled) {
      background: #444;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .roulette-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .wheel-container {
      perspective: 1000px;
      margin: 20px 0;
    }

    .wheel {
      width: 200px;
      height: 200px;
      margin: 0 auto;
      border-radius: 50%;
      border: 8px solid #4a90e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #4a90e2;
      transition: transform 0.1s;
      word-wrap: break-word;
      word-break: break-word;
      padding: 20px;
      overflow: hidden;
    }

    .wheel.spinning {
      animation: spin 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f7ff;
      border-radius: 6px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.dark-mode .result {
      background: #1a3a52;
    }

    .result-text {
      font-size: 16px;
      font-weight: 500;
    }

    .item-list {
      background: #fafafa;
      border-radius: 6px;
      padding: 15px;
    }

    body.dark-mode .item-list {
      background: #2a2a2a;
    }

    .item-list-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    body.dark-mode .item-list-title {
      color: #aaa;
    }

    .items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .item-tag {
      background: white;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.dark-mode .item-tag {
      background: #333;
      border-color: #444;
    }

    .item-tag button {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 1;
    }

    body.dark-mode .item-tag button {
      color: #666;
    }

    .item-tag button:hover {
      color: #e74c3c;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 20px 0;
      font-size: 13px;
    }

    body.dark-mode .empty-state {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎡 Roulette</h1>
      <button class="dark-mode-toggle" onclick="toggleDarkMode()">Dark</button>
    </header>

    <div class="input-section">
      <label for="itemInput">項目を入力（1行1項目）</label>
      <textarea 
        id="itemInput" 
        placeholder="項目1&#10;項目2&#10;項目3&#10;..."></textarea>
      <div class="hint">入力後、「回転」ボタンでランダムに選択します</div>
    </div>

    <div class="roulette-section">
      <div class="wheel-container">
        <div class="wheel" id="wheel">🎡</div>
      </div>
      <div class="result">
        <div class="result-text" id="resultText">入力して回転を押してください</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-spin" onclick="spinRoulette()">回転</button>
      <button class="btn-clear" onclick="clearItems()">クリア</button>
    </div>

    <div class="item-list">
      <div class="item-list-title">登録済み項目</div>
      <div class="items" id="itemsList">
        <div class="empty-state">項目を入力してください</div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'roulette_items';
    let items = [];
    let isSpinning = false;

    function loadItems() {
      const saved = localStorage.getItem(STORAGE_KEY);
      items = saved ? JSON.parse(saved) : [];
      updateDisplay();
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function updateDisplay() {
      const textarea = document.getElementById('itemInput');
      textarea.value = items.join('\n');
      
      const itemsList = document.getElementById('itemsList');
      if (items.length === 0) {
        itemsList.innerHTML = '<div class="empty-state">項目を入力してください</div>';
      } else {
        itemsList.innerHTML = items.map((item, idx) => `
          <div class="item-tag">
            <span>${escapeHtml(item)}</span>
            <button onclick="removeItem(${idx})">×</button>
          </div>
        `).join('');
      }
    }

    function updateItemsFromTextarea() {
      const textarea = document.getElementById('itemInput');
      items = textarea.value
        .split('\n')
        .map(item => item.trim())
        .filter(item => item.length > 0);
      saveItems();
      updateDisplay();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      saveItems();
      updateDisplay();
    }

    function spinRoulette() {
      updateItemsFromTextarea();
      
      if (items.length === 0) {
        alert('項目を入力してください');
        return;
      }

      if (isSpinning) return;
      isSpinning = true;

      const wheel = document.getElementById('wheel');
      const resultText = document.getElementById('resultText');
      
      wheel.classList.remove('spinning');
      void wheel.offsetWidth;
      wheel.classList.add('spinning');

      const spinCount = Math.floor(Math.random() * items.length) + items.length * 5;
      const selectedIdx = Math.floor(Math.random() * items.length);
      
      setTimeout(() => {
        wheel.classList.remove('spinning');
        wheel.textContent = items[selectedIdx];
        resultText.textContent = `🎉 ${items[selectedIdx]}`;
        isSpinning = false;
      }, 800);
    }

    function clearItems() {
      if (confirm('すべての項目を削除しますか？')) {
        items = [];
        saveItems();
        updateDisplay();
        document.getElementById('resultText').textContent = '入力して回転を押してください';
        document.getElementById('wheel').textContent = '🎡';
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('roulette_dark_mode', document.body.classList.contains('dark-mode'));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 初期化
    loadItems();
    if (localStorage.getItem('roulette_dark_mode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    // テキスト変更を監視
    document.getElementById('itemInput').addEventListener('change', () => {
      updateItemsFromTextarea();
    });
    document.getElementById('itemInput').addEventListener('blur', () => {
      updateItemsFromTextarea();
    });
  </script>
</body>
</html>
